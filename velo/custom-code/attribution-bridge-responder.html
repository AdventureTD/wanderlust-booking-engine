<!-- Production responder for #wbeAttributionBridge.
     Install as a SEPARATE Wix Custom Code entry:
       Name: WBE Attribution Bridge Responder
       Placement: Head
       Pages: All pages
     This code is read-only. It never creates a booking or sends a conversion. -->
<script>
  (function () {
    var IFRAME_ORIGIN = 'https://www-wanderlustcaribbean-com.filesusr.com';
    var STORAGE_KEY = 'wl_click_attribution';
    var ATTRIBUTION_WINDOW_DAYS = 90;
    var MAX_AGE_MS = ATTRIBUTION_WINDOW_DAYS * 24 * 60 * 60 * 1000;

    function clean(value, maxLength) {
      if (value === undefined || value === null) return '';
      return String(value).trim().slice(0, maxLength);
    }

    function readValidAttribution() {
      try {
        var raw = localStorage.getItem('wl_click_attribution');
        if (!raw) return null;
        var source = JSON.parse(raw);
        if (!source || typeof source !== 'object') return null;

        var capturedAt = clean(source.capturedAt, 64);
        if (capturedAt) {
          var capturedMs = new Date(capturedAt).getTime();
          if (!isFinite(capturedMs) || Date.now() - capturedMs > MAX_AGE_MS) return null;
        }

        var record = {
          gclid: clean(source.gclid, 512),
          gbraid: clean(source.gbraid, 512),
          wbraid: clean(source.wbraid, 512),
          msclkid: clean(source.msclkid, 512),
          capturedAt: capturedAt,
          landingUrl: clean(source.landingUrl, 2048)
        };
        if (!(record.gclid || record.gbraid || record.wbraid || record.msclkid)) return null;
        return record;
      } catch (e) {
        return null;
      }
    }

    window.addEventListener('message', function (event) {
      try {
        if (event.origin !== IFRAME_ORIGIN) return;
        var d = event && event.data;
        if (!d || typeof d !== 'object') return;
        if (d.source !== 'wbe-attribution-bridge-page-request') return;
        if (d.version !== 1 || !d.requestId) return;
        if (!event.source || typeof event.source.postMessage !== 'function') return;

        var attribution = readValidAttribution();
        event.source.postMessage({
          type: 'wbe-attribution-bridge-page-response',
          version: 1,
          requestId: String(d.requestId).slice(0, 128),
          payload: attribution
        }, IFRAME_ORIGIN);

        console.log('[WBE-ATTR-HEAD] request answered:', JSON.stringify({
          googleIdPresent: !!(attribution && (attribution.gclid || attribution.gbraid || attribution.wbraid)),
          microsoftIdPresent: !!(attribution && attribution.msclkid),
          capturedAtPresent: !!(attribution && attribution.capturedAt)
        }));
      } catch (e) {
        console.error('[WBE-ATTR-HEAD] responder error:', e && e.message || e);
      }
    });
  })();
</script>
