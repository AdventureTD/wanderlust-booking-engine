<!DOCTYPE html>
<!-- Phase 1 diagnostic HTML Component.
     Paste into #attributionTestBridge on the hidden diagnostic page only.
     Do not collapse the component. It may be 1x1 or placed off-canvas. -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
<script>
  (function () {
    var readyTimer = null;
    var requestReceived = false;

    function sendToParent(message) {
      window.parent.postMessage(message, '*');
    }

    function announceReady() {
      if (requestReceived) return;
      sendToParent({
        type: 'wbe-attribution-ready',
        version: 1
      });
    }

    // Repeat readiness because the first message may precede the Velo listener.
    announceReady();
    readyTimer = setInterval(announceReady, 400);
    setTimeout(function () {
      if (readyTimer) clearInterval(readyTimer);
    }, 12000);

    window.onmessage = function (event) {
      try {
        var d = event && event.data;
        if (!d || typeof d !== 'object') return;

        if (d.type === 'wbe-attribution-request' && d.requestId) {
          requestReceived = true;
          if (readyTimer) clearInterval(readyTimer);
          sendToParent({
            source: 'wbe-attribution-diagnostic-request',
            version: 1,
            requestId: String(d.requestId).slice(0, 128)
          });
          return;
        }

        if (d.type === 'wbe-attribution-page-response' && d.requestId) {
          sendToParent({
            type: 'wbe-attribution-response',
            version: 1,
            requestId: String(d.requestId).slice(0, 128),
            payload: d.payload || null,
            iframeOrigin: d.iframeOrigin || ''
          });
        }
      } catch (e) {
        sendToParent({
          type: 'wbe-attribution-response',
          version: 1,
          requestId: '',
          payload: null,
          diagnosticError: String(e && e.message || e)
        });
      }
    };
  })();
</script>
</body>
</html>
