<!-- Google tag (gtag.js) + Consent Mode v2 — paste in Wix Settings → Custom Code → Head -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MKGG3X1WP9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Default consent: denied until user confirms.
  gtag('consent', 'default', {
    ad_storage: 'denied',
    analytics_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied'
  });

  // Configuration: one config call per Google property.
  gtag('config', 'G-MKGG3X1WP9');
  gtag('config', 'AW-788746633');

  // Capture Google Ads click IDs before Wix's client-side router strips them.
  (function () {
    function parseParams(url) {
      const out = {};
      const idx = (url || '').indexOf('?');
      if (idx === -1) return out;
      const qs = url.substring(idx + 1);
      const pairs = qs.split('&');
      for (let i = 0; i < pairs.length; i++) {
        const pair = pairs[i];
        const eq = pair.indexOf('=');
        if (eq === -1) { out[decodeURIComponent(pair)] = ''; continue; }
        out[decodeURIComponent(pair.substring(0, eq))] = decodeURIComponent(pair.substring(eq + 1));
      }
      return out;
    }

    const params = parseParams(window.location.href);
    if (params.gclid || params.gbraid || params.wbraid || params.msclkid) {
      try {
        const record = {
          gclid: params.gclid || '',
          gbraid: params.gbraid || '',
          wbraid: params.wbraid || '',
          msclkid: params.msclkid || '',
          landingUrl: window.location.href,
          capturedAt: new Date().toISOString()
        };
        localStorage.setItem('wl_click_attribution', JSON.stringify(record));
      } catch (e) {}
    }
  })();

  // Grant consent per-category: the Wix banner's analytics/advertising toggles
  // map to their matching Google Consent Mode signals. A blanket grant would
  // unlock ad cookies for analytics-only visitors — this keeps it precise.
  // grantConsent() with no args = full grant (legacy callers).
  var _granted = { analytics: false, advertising: false };
  function grantConsent(analytics, advertising) {
    if (analytics === undefined) { analytics = true; advertising = true; }
    var update = {};
    if (analytics && !_granted.analytics) {
      update.analytics_storage = 'granted';
      _granted.analytics = true;
    }
    if (advertising && !_granted.advertising) {
      update.ad_storage = 'granted';
      update.ad_user_data = 'granted';
      update.ad_personalization = 'granted';
      _granted.advertising = true;
    }
    if (Object.keys(update).length > 0) {
      gtag('consent', 'update', update);
      console.log('[WBE-CONSENT] Google consent updated:', JSON.stringify(update));
    }
  }

  // Path 1: custom event (kept for any future non-sandboxed dispatcher).
  document.addEventListener('wbeConsentGranted', function () { grantConsent(); });

  // This separate gate is NEVER opened by grantConsent(), Wix policy or auto-grant.
  // Default-OFF until the owner activates the existing banner and binds the iframe title.
  if (!window.__wbeAdsFormGate) {
    window.__wbeAdsFormGate = (function () {
      var allowed = false, revision = 0, acceptedAt = 0, lastChecked = 0;
      var states = new WeakMap();
      var selector = '#comp-mqo6cvon input[type="email"][name="email"]';
      function choice(value, at) {
        allowed = value === true;
        acceptedAt = at;
        lastChecked = at;
        revision++;
        currentChoice();
      }
      function currentChoice() {
        var now = Date.now();
        if (allowed && (!Number.isSafeInteger(acceptedAt) || acceptedAt < 0 ||
            !Number.isSafeInteger(now) || now < lastChecked || now < acceptedAt ||
            now - acceptedAt >= 15552000000)) {
          allowed = false;
          revision++;
        }
        lastChecked = now;
        return allowed;
      }
      // Observe revocations only; a Google grant can never establish provenance.
      var priorPush = window.dataLayer.push;
      window.dataLayer.push = function () {
        for (var i = 0; i < arguments.length; i++) {
          var entry = arguments[i];
          if (entry && entry[0] === 'consent' && entry[1] === 'update' &&
              entry[2] && entry[2].ad_user_data === 'denied') {
            choice(false);
            _granted.advertising = false;
            if (entry[2].analytics_storage === 'denied') _granted.analytics = false;
            // No gtag call here: avoid recursive observation. Initial defaults are not choices.
            // Remove stale authority first, including when a quota error prevents the denial write.
            try { localStorage.removeItem('wbe_consent_choice_v2'); } catch (e) {}
            try { localStorage.setItem('wbe_consent_choice_v2', JSON.stringify({
              source: 'banner-click-v2', choice: 'denied', at: Date.now()
            })); } catch (e) {}
          }
        }
        return priorPush.apply(this, arguments);
      };
      window.addEventListener('storage', function (e) {
        if (!e.key || e.key === 'wbe_consent_choice_v2') choice(false);
      });
      window.addEventListener('message', function (event) {
        try {
          var d = event.data;
          if (!d || d.source !== 'wbe-ads-form' || Object.keys(d).length !== 3 ||
              ['prepare', 'complete'].indexOf(d.phase) === -1 ||
              !Number.isSafeInteger(d.sequence) || d.sequence < 1) return;
          var frames = document.querySelectorAll('iframe[title="WBE event bridge"]');
          if (frames.length !== 1 || frames[0].contentWindow !== event.source ||
              new URL(frames[0].src).origin !== event.origin || event.origin === 'null') return;
          currentChoice(); // Recheck retention and clock rollback at every use.
          var old = states.get(event.source);
          if (d.phase === 'prepare') {
            if (old && d.sequence <= old.sequence) return;
            var fields = allowed ? document.querySelectorAll(selector) : [];
            var email = fields.length === 1 ? fields[0].value.trim() : '';
            states.set(event.source, { sequence: d.sequence, revision: revision,
              eligible: allowed && email.indexOf('@') > 0, email: email, at: Date.now() });
            return;
          }
          if (!old || old.sequence !== d.sequence) return;
          // Consume before calling external tag code; no uncertain-send retries.
          states.set(event.source, { sequence: d.sequence });
          if (!allowed || !old.eligible || revision !== old.revision ||
              Date.now() < old.at || Date.now() - old.at > 600000) return;
          var current = document.querySelectorAll(selector);
          if (current.length !== 1 || current[0].value.trim() !== old.email) return;
          // Existing Ads manual selector supplies data, if supported by the collector.
          // This is a deterministic signal, NOT proof that email was transmitted.
          gtag('event', 'form_submit', { send_to: 'AW-788746633' });
        } catch (e) { /* Optional, fail closed, no contact/error logging. */ }
      });
      return { choice: choice };
    })();
  }

  // Path 2 (primary): our own consent banner below. Choice persists in the
  // PAGE's localStorage (wbe_consent_choice: 'granted' | 'denied'), which is
  // readable here — unlike Velo's partitioned storage. On load, a stored
  // 'granted' re-grants silently; a stored 'denied' keeps defaults; no stored
  // choice shows the banner.
  (function () {
    // Master switch for the consent banner. Set false to hide the banner.
    // With the banner hidden you must also pick what consent defaults to:
    //   GRANT_ALL_WITHOUT_BANNER false  -> strict: everything stays denied
    //                                     (no GA4, no remarketing; EU-safe)
    //   GRANT_ALL_WITHOUT_BANNER true   -> track everyone silently (US-tolerant,
    //                                     NOT recommended if you get EU/UK traffic)
    var BANNER_ENABLED = false;
    var GRANT_ALL_WITHOUT_BANNER = true;
    var CHOICE_KEY = 'wbe_consent_choice_v2'; // Old/automatic choices are not provenance.
    var PRIVACY_URL = 'https://www.wanderlustcaribbean.com/policies';

    if (!BANNER_ENABLED) {
      if (GRANT_ALL_WITHOUT_BANNER) { grantConsent(); }
      return;
    }

    function getChoice() {
      try {
        var v = JSON.parse(localStorage.getItem(CHOICE_KEY));
        if (!v || Object.keys(v).length !== 3 || v.source !== 'banner-click-v2' ||
            ['granted', 'denied'].indexOf(v.choice) === -1 || !Number.isSafeInteger(v.at) || v.at < 0 ||
            Date.now() < v.at || Date.now() - v.at >= 15552000000) return null;
        return v;
      } catch (e) { return null; }
    }
    function setChoice(v, at) {
      try { localStorage.setItem(CHOICE_KEY, JSON.stringify({ source: 'banner-click-v2', choice: v, at: at === undefined ? Date.now() : at })); } catch (e) {}
    }

    function hideBanner() {
      var el = document.getElementById('wbe-consent-banner');
      if (el && el.parentNode) { el.parentNode.removeChild(el); }
    }

    function acceptAll(event) {
      if (!event || event.isTrusted !== true) return;
      var at = Date.now();
      window.__wbeAdsFormGate.choice(true, at);
      setChoice('granted', at);
      grantConsent();
      hideBanner();
      console.log('[WBE-CONSENT] visitor accepted all');
    }

    function denyAll() {
      window.__wbeAdsFormGate.choice(false);
      _granted = { analytics: false, advertising: false };
      gtag('consent', 'update', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      setChoice('denied');
      hideBanner();
      console.log('[WBE-CONSENT] visitor denied; defaults remain');
    }

    function showBanner() {
      if (document.getElementById('wbe-consent-banner')) { return; }
      var bar = document.createElement('div');
      bar.id = 'wbe-consent-banner';
      bar.setAttribute('role', 'dialog');
      bar.setAttribute('aria-label', 'Cookie consent');
      bar.style.cssText =
        'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;' +
        'background:#12312a;color:#f3ede0;font-family:inherit;font-size:14px;' +
        'padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;' +
        'gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,.35);';

      var text = document.createElement('div');
      text.style.cssText = 'flex:1 1 320px;min-width:260px;line-height:1.45;';
      text.innerHTML =
        'We use cookies to improve your experience and to show you relevant ' +
        'ads about Wanderlust Caribbean. Accept All also allows use of your booking email ' +
        'to measure advertising through Google. ' +
        '<a href="' + PRIVACY_URL + '" style="color:#d9b95c;text-decoration:underline;">Privacy Policy</a>';
      bar.appendChild(text);

      var btns = document.createElement('div');
      btns.style.cssText = 'display:flex;gap:10px;flex:0 0 auto;';

      var deny = document.createElement('button');
      deny.type = 'button';
      deny.textContent = 'Deny';
      deny.style.cssText =
        'padding:9px 18px;border:1px solid #d9b95c;background:transparent;' +
        'color:#d9b95c;cursor:pointer;border-radius:4px;font-size:14px;';
      deny.addEventListener('click', denyAll);
      btns.appendChild(deny);

      var accept = document.createElement('button');
      accept.type = 'button';
      accept.textContent = 'Accept All';
      accept.style.cssText =
        'padding:9px 18px;border:none;background:#d9b95c;color:#12312a;' +
        'cursor:pointer;border-radius:4px;font-size:14px;font-weight:600;';
      accept.addEventListener('click', acceptAll);
      btns.appendChild(accept);

      bar.appendChild(btns);
      document.body.appendChild(bar);
    }

    function initBanner() {
      if (!document.getElementById('wbe-consent-settings')) {
        var settings = document.createElement('button');
        settings.id = 'wbe-consent-settings';
        settings.type = 'button';
        settings.textContent = 'Cookie settings';
        settings.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:2147482999;padding:9px 18px;background:#12312a;color:#f3ede0;border:1px solid #d9b95c;border-radius:4px;cursor:pointer;';
        settings.addEventListener('click', showBanner);
        document.body.appendChild(settings);
      }
      var choice = getChoice();
      if (choice && choice.choice === 'granted') {
        window.__wbeAdsFormGate.choice(true, choice.at);
        grantConsent();
        return;
      }
      if (choice && choice.choice === 'denied') { return; }
      showBanner();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initBanner);
    } else {
      initBanner();
    }
  })();

  // Receive GA4/Ads events from Velo page code via the wbeEventBridge HTML
  // iframe on the Master Page (Velo localStorage is partitioned; postMessage
  // through the iframe is the reliable cross-context channel).
  // Plain-object dataLayer pushes are inert to raw gtag — translate them into
  // real gtag('event', ...) calls so GA4 actually receives the hits.
  // One consumer per parent-page realm, even if Wix executes this entry again.
  if (!window.__wbeGoogleEventListenerInstalled) {
  window.__wbeGoogleEventListenerInstalled = true;
  window.addEventListener('message', function (event) {
    var d = event && event.data;
    if (d && d.source === 'wbe-event-bridge' && d.payload) {
      var p = d.payload;
      if (p.event) {
        var name = p.event;
        var params = {};
        Object.keys(p).forEach(function (k) {
          if (k !== 'event') { params[k] = p[k]; }
        });
        gtag('event', name, params);
        console.log('[WBE-GTAG] gtag event sent:', name, JSON.stringify(params));
      }
    }
  });
  }
</script>

<!-- Microsoft UET is intentionally installed as a separate Wix Custom Code
     entry using custom-code/microsoft-uet-and-events.html. Keeping one UET
     owner avoids duplicate tags and ensures it runs on every funnel page. -->
