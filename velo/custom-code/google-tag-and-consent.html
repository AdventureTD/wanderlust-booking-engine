<!-- Google tag (gtag.js) + Consent Mode v2 — paste in Wix Settings → Custom Code → Head -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MKGG3X1WP9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Default consent: denied until user confirms.
  gtag('consent', 'default', {
    ad_storage: 'denied',
    analytics_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied'
  });

  // Configuration: one config call per Google property.
  gtag('config', 'G-MKGG3X1WP9');
  gtag('config', 'AW-788746633');

  // Capture Google Ads click IDs before Wix's client-side router strips them.
  (function () {
    function parseParams(url) {
      const out = {};
      const idx = (url || '').indexOf('?');
      if (idx === -1) return out;
      const qs = url.substring(idx + 1);
      const pairs = qs.split('&');
      for (let i = 0; i < pairs.length; i++) {
        const pair = pairs[i];
        const eq = pair.indexOf('=');
        if (eq === -1) { out[decodeURIComponent(pair)] = ''; continue; }
        out[decodeURIComponent(pair.substring(0, eq))] = decodeURIComponent(pair.substring(eq + 1));
      }
      return out;
    }

    const params = parseParams(window.location.href);
    if (params.gclid || params.gbraid || params.wbraid || params.msclkid) {
      try {
        const record = {
          gclid: params.gclid || '',
          gbraid: params.gbraid || '',
          wbraid: params.wbraid || '',
          msclkid: params.msclkid || '',
          landingUrl: window.location.href,
          capturedAt: new Date().toISOString()
        };
        localStorage.setItem('wl_click_attribution', JSON.stringify(record));
      } catch (e) {}
    }
  })();

  // Local provider signals only, not a receipt or a Wix CMP authority bridge.
  // Each primitive Boolean controls exactly one purpose; omitted values deny.
  // Private transitions and control callbacks are API hygiene, not same-realm
  // isolation: page scripts can still manipulate the DOM or dataLayer.
  (function () {
  var _granted = { analytics_storage: false, ad_storage: false,
    ad_user_data: false, ad_personalization: false };
  function grantConsent(analytics, adStorage, adUserData, adPersonalization) {
    var next = { analytics_storage: analytics === true, ad_storage: adStorage === true,
      ad_user_data: adUserData === true, ad_personalization: adPersonalization === true };
    var update = {};
    Object.keys(next).forEach(function (key) {
      if (next[key] !== _granted[key]) {
        update[key] = next[key] ? 'granted' : 'denied';
      }
    });
    if (Object.keys(update).length > 0) {
      try {
        gtag('consent', 'update', update);
        _granted = next;
      } catch (e) {} // Do not block local withdrawal; a later call retries the update.
    }
  }

  // Unqualified wbeConsentGranted events carry no purpose/provenance authority.
  // No grant listener: only explicit local controls below apply choices.

  // Own banner storage is conservative local suppression, never a server receipt.
  // Legacy 'granted' is deliberately not restored; this can reduce measurement.
  // The loading architecture is unchanged: denied mode can still send pings.
    // Master switch for the consent banner. Set false to hide the banner.
    // Visibility is not consent authority; hidden never grants.
    var BANNER_ENABLED = false;
    var CHOICE_KEY = 'wbe_consent_choice';
    var PRIVACY_URL = 'https://www.wanderlustcaribbean.com/policies';

    // Same-page local withdrawal, including when hidden. Visible privacy-page
    // wiring is a separate deployment gate; this does not create a receipt.
    window.wbeWithdrawConsent = denyAll;

    // Cross-tab storage is suppression only, never permission. Do not write back.
    window.addEventListener('storage', function (event) {
      if (!event || (event.key !== CHOICE_KEY && event.key !== null)) { return; }
      try {
        if (event.storageArea && event.storageArea !== localStorage) { return; }
      } catch (e) {} // Unreadable storage cannot preserve optional grants.
      grantConsent(false, false, false, false);
    });


    function getChoice() {
      try { return localStorage.getItem(CHOICE_KEY); } catch (e) { return null; }
    }
    function setChoice(v) {
      try { localStorage.setItem(CHOICE_KEY, v); } catch (e) {}
    }

    function hideBanner() {
      try {
        var el = document.getElementById('wbe-consent-banner');
        if (el && el.parentNode) { el.parentNode.removeChild(el); }
      } catch (e) {} // DOM failure must not interrupt withdrawal or booking.
    }

    function acceptAll() {
      setChoice('granted');
      grantConsent(true, true, true, true);
      hideBanner();
      console.log('[WBE-CONSENT] visitor accepted all');
    }

    function denyAll() {
      grantConsent(false, false, false, false);
      setChoice('denied');
      hideBanner();
      console.log('[WBE-CONSENT] visitor denied');
    }

    function showBanner() {
      if (document.getElementById('wbe-consent-banner')) { return; }
      var bar = document.createElement('div');
      bar.id = 'wbe-consent-banner';
      bar.setAttribute('role', 'dialog');
      bar.setAttribute('aria-label', 'Cookie consent');
      bar.style.cssText =
        'position:fixed;left:0;right:0;bottom:0;z-index:2147483000;' +
        'background:#12312a;color:#f3ede0;font-family:inherit;font-size:14px;' +
        'padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;' +
        'gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,.35);';

      var text = document.createElement('div');
      text.style.cssText = 'flex:1 1 320px;min-width:260px;line-height:1.45;';
      text.innerHTML =
        'We use cookies to improve your experience and to show you relevant ' +
        'ads about Wanderlust Caribbean. ' +
        '<a href="' + PRIVACY_URL + '" style="color:#d9b95c;text-decoration:underline;">Privacy Policy</a>';
      bar.appendChild(text);

      var btns = document.createElement('div');
      btns.style.cssText = 'display:flex;gap:10px;flex:0 0 auto;';

      var deny = document.createElement('button');
      deny.type = 'button';
      deny.textContent = 'Deny';
      deny.style.cssText =
        'padding:9px 18px;border:1px solid #d9b95c;background:transparent;' +
        'color:#d9b95c;cursor:pointer;border-radius:4px;font-size:14px;';
      deny.addEventListener('click', denyAll);
      btns.appendChild(deny);

      var accept = document.createElement('button');
      accept.type = 'button';
      accept.textContent = 'Accept All';
      accept.style.cssText =
        'padding:9px 18px;border:none;background:#d9b95c;color:#12312a;' +
        'cursor:pointer;border-radius:4px;font-size:14px;font-weight:600;';
      accept.addEventListener('click', acceptAll);
      btns.appendChild(accept);

      bar.appendChild(btns);
      document.body.appendChild(bar);
    }

    var initialized = false;
    function initBanner() {
      if (initialized) { return; }
      initialized = true;
      var choice = getChoice();
      // Legacy 'granted' has no verified purpose/provenance; require a new choice.
      if (choice === 'denied') {
        grantConsent(false, false, false, false);
        return;
      }
      if (!BANNER_ENABLED) { return; }
      try { showBanner(); } catch (e) {} // Optional UI cannot block event setup.
    }

    if (BANNER_ENABLED && document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initBanner);
    } else {
      initBanner();
    }
  })();

  // Receive GA4/Ads events from Velo page code via the wbeEventBridge HTML
  // iframe on the Master Page (Velo localStorage is partitioned; postMessage
  // through the iframe is the reliable cross-context channel).
  // Plain-object dataLayer pushes are inert to raw gtag — translate them into
  // real gtag('event', ...) calls so GA4 actually receives the hits.
  window.addEventListener('message', function (event) {
    var d = event && event.data;
    if (d && d.source === 'wbe-event-bridge' && d.payload) {
      var p = d.payload;
      if (p.event) {
        var name = p.event;
        var params = {};
        Object.keys(p).forEach(function (k) {
          if (k !== 'event') { params[k] = p[k]; }
        });
        gtag('event', name, params);
        console.log('[WBE-GTAG] gtag event sent:', name, JSON.stringify(params));
      }
    }
  });
</script>

<!-- Microsoft UET is intentionally installed as a separate Wix Custom Code
     entry using custom-code/microsoft-uet-and-events.html. Keeping one UET
     owner avoids duplicate tags and ensures it runs on every funnel page. -->
