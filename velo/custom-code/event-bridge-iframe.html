<!DOCTYPE html>
<!-- Paste this into the wbeEventBridge HTML iframe on the Master Page.
     Receives postMessage events from Velo page code, relays them up to the
     parent window where the head snippet pushes them into window.dataLayer. -->
<html>
<head><meta charset="utf-8">
<style>
  /* Keep the bridge invisible: zero-size, nothing rendered. Scripts still run. */
  html, body { margin: 0; padding: 0; width: 0; height: 0; overflow: hidden; visibility: hidden; }
</style>
</head>
<body>
<script>
  function validPolicy(p, purpose, phase, nonce, challenge) {
    return p && Object.keys(p).sort().join(',') === 'audience,challenge,nonce,observedAt,phase,policyKey,purpose,requirement,v' && p.v === 2 &&
      p.audience === 'https://www.wanderlustcaribbean.com' && p.purpose === purpose && p.phase === phase &&
      p.nonce === nonce && /^[a-f0-9]{32}$/.test(p.challenge) && (!challenge || p.challenge === challenge) &&
      ['REQUIRED', 'NOT_REQUIRED'].indexOf(p.requirement) !== -1 && typeof p.policyKey === 'string' &&
      /^[a-f0-9]{64}$/.test(p.policyKey) && Number.isSafeInteger(p.observedAt) && p.observedAt >= 0;
  }
  function validRecord(r) {
    return r === null || (r && Object.keys(r).sort().join(',') === 'capturedAt,gbraid,gclid,msclkid,wbraid' &&
      typeof r.capturedAt === 'string' && r.capturedAt.length <= 30 &&
      ['gclid', 'gbraid', 'wbraid', 'msclkid'].every(function (k) {
        return typeof r[k] === 'string' && r[k].length <= 512 && (r[k] === '' || /^[\x21-\x7e]+$/.test(r[k]));
      }));
  }
  window.onmessage = function (event) {
    try {
      var d = event && event.data;
      // Separate attribution read/clear protocol; only the canonical parent.
      var canonical = 'https://www.wanderlustcaribbean.com';
      if (event.source === window.parent && event.origin === canonical && new URL(document.referrer).origin === canonical) {
        if (d && d.type === 'wbe-click-attribution' && d.v === 2 &&
            Object.keys(d).sort().join(',') === 'channel,nonce,op,policy,record,sequence,type,v' &&
            /^[a-f0-9]{32}$/.test(d.nonce) && (d.op === 'open' ? d.channel === '' : /^[a-f0-9]{32}$/.test(d.channel)) &&
            ['open', 'read', 'confirm', 'clear'].indexOf(d.op) !== -1 && Number.isSafeInteger(d.sequence) && d.sequence > 0 &&
            validRecord(d.record) && (['open', 'clear'].indexOf(d.op) !== -1 ? d.policy === null : validPolicy(d.policy, 'attribution', 'read', d.nonce, d.channel))) {
          window.parent.postMessage({ source: 'wbe-click-attribution', v: 2, op: d.op, sequence: d.sequence, nonce: d.nonce, channel: d.channel, policy: d.policy, record: d.record }, canonical);
          return;
        }
        if (d && d.type === 'wbe-click-attribution-result' && d.v === 2 &&
            Object.keys(d).sort().join(',') === 'allowed,channel,nonce,op,record,sequence,type,v' &&
            /^[a-f0-9]{32}$/.test(d.nonce) && /^[a-f0-9]{32}$/.test(d.channel) &&
            ['open', 'read', 'confirm', 'clear'].indexOf(d.op) !== -1 && Number.isSafeInteger(d.sequence) && d.sequence > 0 && typeof d.allowed === 'boolean' && validRecord(d.record)) {
          window.parent.postMessage(d, canonical);
          return;
        }
        if (d && d.type === 'wbe-click-revoke' && d.v === 2 &&
            Object.keys(d).sort().join(',') === 'channel,nonce,type,v' &&
            /^[a-f0-9]{32}$/.test(d.nonce) && /^[a-f0-9]{32}$/.test(d.channel)) {
          window.parent.postMessage(d, canonical); return;
        }
      }
      // Both form phases require a canonical-parent start ACK before RPC.
      if (event.source === window.parent && event.origin === canonical && new URL(document.referrer).origin === canonical) {
        if (d && d.type === 'wbe-ads-form' && d.v === 2 &&
            Object.keys(d).sort().join(',') === 'nonce,op,phase,policy,sequence,type,v' &&
            Number.isSafeInteger(d.sequence) && d.sequence > 0 && typeof d.nonce === 'string' && /^[a-f0-9]{32}$/.test(d.nonce) &&
            ['prepare', 'complete'].indexOf(d.phase) !== -1 &&
            (d.op === 'start' && d.policy === null || d.op === 'result' && validPolicy(d.policy, 'form', d.phase, d.nonce))) {
          window.parent.postMessage({ source: 'wbe-ads-form', v: 2, op: d.op, phase: d.phase,
            sequence: d.sequence, nonce: d.nonce, policy: d.policy }, canonical);
          return;
        }
        if (d && d.type === 'wbe-ads-form-started' && d.v === 2 &&
            Object.keys(d).sort().join(',') === 'challenge,nonce,phase,sequence,type,v' &&
            Number.isSafeInteger(d.sequence) && d.sequence > 0 && ['prepare', 'complete'].indexOf(d.phase) !== -1 &&
            typeof d.nonce === 'string' && /^[a-f0-9]{32}$/.test(d.nonce) &&
            typeof d.challenge === 'string' && /^[a-f0-9]{32}$/.test(d.challenge)) {
          window.parent.postMessage(d, canonical);
          return;
        }
      }
      if (event.source === window.parent && event.origin === canonical && new URL(document.referrer).origin === canonical && d && d.type === 'wbe-datalayer-event' && d.payload) {
        window.parent.postMessage({
          source: 'wbe-event-bridge',
          payload: d.payload
        }, canonical);
      }
    } catch (e) {}
  };
</script>
</body>
</html>
