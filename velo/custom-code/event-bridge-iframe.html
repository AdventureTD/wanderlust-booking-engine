<!DOCTYPE html>
<!-- Paste this into the wbeEventBridge HTML iframe on the Master Page.
     Receives postMessage events from Velo page code, relays them up to the
     parent window where the head snippet pushes them into window.dataLayer. -->
<html>
<head><meta charset="utf-8">
<style>
  /* Keep the bridge invisible: zero-size, nothing rendered. Scripts still run. */
  html, body { margin: 0; padding: 0; width: 0; height: 0; overflow: hidden; visibility: hidden; }
</style>
</head>
<body>
<script>
  window.onmessage = function (event) {
    try {
      var d = event && event.data;
      // Dedicated fixed schema: never forward arbitrary fields or contacts.
      if (event.source === window.parent && d && d.type === 'wbe-ads-form' &&
          Object.keys(d).length === 3 && ['prepare', 'complete'].indexOf(d.phase) !== -1 &&
          Number.isSafeInteger(d.sequence) && d.sequence > 0) {
        var parentOrigin = new URL(document.referrer).origin;
        if (parentOrigin !== 'https://www.wanderlustcaribbean.com' || event.origin !== parentOrigin) return;
        window.parent.postMessage({ source: 'wbe-ads-form', phase: d.phase, sequence: d.sequence }, parentOrigin);
        return;
      }
      if (d && d.type === 'wbe-datalayer-event' && d.payload) {
        window.parent.postMessage({
          source: 'wbe-event-bridge',
          payload: d.payload
        }, '*');
      }
    } catch (e) {}
  };
</script>
</body>
</html>
