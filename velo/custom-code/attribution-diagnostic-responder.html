<!-- Phase 1 attribution diagnostic responder.
     Add as a SEPARATE Wix Custom Code entry:
       Name: WBE Attribution Diagnostic Responder
       Placement: Head
       Pages: attribution-diagnostic page ONLY
     Do not assign this test entry to All Pages. -->
<script>
  (function () {
    var STORAGE_KEY = 'wl_click_attribution';

    window.addEventListener('message', function (event) {
      var d = event && event.data;
      if (!d || d.source !== 'wbe-attribution-diagnostic-request' || !d.requestId) return;

      var attribution = null;
      try {
        var raw = localStorage.getItem('wl_click_attribution');
        attribution = raw ? JSON.parse(raw) : null;
      } catch (e) {
        attribution = null;
      }

      try {
        if (event.source && typeof event.source.postMessage === 'function') {
          event.source.postMessage({
            type: 'wbe-attribution-page-response',
            version: 1,
            requestId: String(d.requestId).slice(0, 128),
            payload: attribution,
            iframeOrigin: event.origin || ''
          }, event.origin || '*');
        }
      } catch (e) {
        console.error('[WBE-ATTR-DIAG-HEAD] response failed:', e && e.message || e);
      }

      console.log('[WBE-ATTR-DIAG-HEAD] request answered:', JSON.stringify({
        storageKey: STORAGE_KEY,
        googleIdPresent: !!(attribution && (attribution.gclid || attribution.gbraid || attribution.wbraid)),
        microsoftIdPresent: !!(attribution && attribution.msclkid),
        iframeOrigin: event.origin || ''
      }));
    });
  })();
</script>
