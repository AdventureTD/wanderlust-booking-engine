<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #summaryBg {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #F9DDCB 0%, #FFFFFF 100%);
    }
  </style>
</head>
<body>
  <div id="summaryBg"></div>
  <script>
    // Listen for visibility toggles from the Velo page.
    window.addEventListener('message', function (event) {
      const data = event.data || {};
      if (data.type === 'wbe-summary-bg') {
        const el = document.getElementById('summaryBg');
        if (el) {
          el.style.display = data.show ? 'block' : 'none';
        }
      }
    });
  </script>
</body>
</html>
