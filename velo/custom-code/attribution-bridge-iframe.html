<!DOCTYPE html>
<!-- Production click-ID transport for #wbeAttributionBridge.
     Responsibility: messaging only. It does not read storage, create bookings,
     or call Google/Microsoft. Keep rendered at 1x1; do not collapse. -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
<script>
  (function () {
    var PARENT_ORIGIN = 'https://www.wanderlustcaribbean.com';
    var readyTimer = null;
    var requestReceived = false;

    function sendToParent(message) {
      window.parent.postMessage(message, PARENT_ORIGIN);
    }

    function announceReady() {
      if (requestReceived) return;
      sendToParent({
        type: 'wbe-attribution-bridge-ready',
        version: 1
      });
    }

    // The Velo listener may attach after this iframe loads. Repeat readiness
    // until Velo sends one request, then stop permanently for this page load.
    announceReady();
    readyTimer = setInterval(announceReady, 400);
    setTimeout(function () {
      if (readyTimer) clearInterval(readyTimer);
    }, 12000);

    window.onmessage = function (event) {
      try {
        if (event.origin !== PARENT_ORIGIN) return;
        var d = event && event.data;
        if (!d || typeof d !== 'object' || d.version !== 1) return;

        if (d.type === 'wbe-attribution-bridge-request' && d.requestId) {
          requestReceived = true;
          if (readyTimer) clearInterval(readyTimer);
          sendToParent({
            source: 'wbe-attribution-bridge-page-request',
            version: 1,
            requestId: String(d.requestId).slice(0, 128)
          });
          return;
        }

        if (d.type === 'wbe-attribution-bridge-page-response' && d.requestId) {
          sendToParent({
            type: 'wbe-attribution-bridge-response',
            version: 1,
            requestId: String(d.requestId).slice(0, 128),
            payload: d.payload || null
          });
        }
      } catch (e) {
        // Attribution is optional. Never throw into the host page.
      }
    };
  })();
</script>
</body>
</html>
